services:
  postgres:
    image: postgres:15-alpine
    container_name: scenic-postgres
    environment:
      POSTGRES_USER: scenic
      POSTGRES_PASSWORD: scenic2024
      POSTGRES_DB: scenic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenic -d scenic_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - scenic-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenic-backend
    ports:
      - "8741:8741"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=scenic
      - DB_PASSWORD=scenic2024
      - DB_NAME=scenic_db
      - JWT_SECRET=scenic-ticket-jwt-secret-2024
      - PORT=8741
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "go mod tidy && go run main.go"
    networks:
      - scenic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scenic-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://backend:8741
    networks:
      - scenic-network

volumes:
  pgdata:

networks:
  scenic-network:
    driver: bridge
